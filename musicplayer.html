<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Music Player with Duration</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f0f0f;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: white;
}

.player {
    width: 400px;
    background: #1e1e1e;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 0 20px black;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

h2, h4, p {
    text-align: center;
    margin: 5px 0;
}

input[type="range"] {
    width: 100%;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 15px;
}

button {
    padding: 10px;
    border: none;
    border-radius: 50%;
    background: #ff3c78;
    color: white;
    cursor: pointer;
}

/* playlist */
.playlist {
    max-height: 200px;
    overflow-y: auto;
}

.song {
    padding: 8px;
    background: #2a2a2a;
    margin: 5px 0;
    border-radius: 5px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
}

.song:hover {
    background: #444;
}

.active {
    background: #ff3c78;
}

.time {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #aaa;
}
</style>
</head>

<body>

<div class="player">

<h2>🎧 Music Player</h2>

<h4 id="title">Title</h4>
<p id="artist">Artist</p>

<audio id="audio"></audio>

<input type="range" id="progress" value="0">

<div class="time">
    <span id="currentTime">0:00</span>
    <span id="duration">0:00</span>
</div>

<div class="controls">
    <button onclick="prevSong()">⏮</button>
    <button id="playBtn" onclick="playPause()">▶️</button>
    <button onclick="nextSong()">⏭</button>
</div>

<input type="range" id="volume" min="0" max="1" step="0.1">

<div class="playlist" id="playlist"></div>

</div>

<script>

const songs = [
{title:"Vaathi Coming",artist:"Anirudh",src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"},
{title:"Arabic Kuthu",artist:"Anirudh",src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"},
{title:"Kutty Story",artist:"GV Prakash",src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"},
{title:"Enjoy Enjaami",artist:"Dhee",src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"},
{title:"Naa Ready",artist:"Vijay",src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3"}
];

let current = 0;
let audio = document.getElementById("audio");
let playBtn = document.getElementById("playBtn");

let progress = document.getElementById("progress");
let volume = document.getElementById("volume");

let title = document.getElementById("title");
let artist = document.getElementById("artist");

let currentTimeEl = document.getElementById("currentTime");
let durationEl = document.getElementById("duration");

let playlist = document.getElementById("playlist");

let isPlaying = false;

// 🎵 load song
function loadSong(i) {
audio.src = songs[i].src;
title.textContent = songs[i].title;
artist.textContent = songs[i].artist;

progress.value = 0;
currentTimeEl.textContent = "0:00";
durationEl.textContent = "0:00";

document.querySelectorAll(".song").forEach((el, idx) => {
el.classList.toggle("active", idx === i);
});
}

// ▶️ play/pause
function playPause() {
if (isPlaying) {
audio.pause();
isPlaying = false;
playBtn.textContent = "▶️";
} else {
audio.play();
isPlaying = true;
playBtn.textContent = "⏸️";
}
}

// ⏭ next
function nextSong() {
current = (current + 1) % songs.length;
loadSong(current);
audio.play();
isPlaying = true;
playBtn.textContent = "⏸️";
}

// ⏮ prev
function prevSong() {
current = (current - 1 + songs.length) % songs.length;
loadSong(current);
audio.play();
isPlaying = true;
playBtn.textContent = "⏸️";
}

// 🔊 volume
volume.addEventListener("input", () => {
audio.volume = Number(volume.value);
});

// 📊 progress
audio.addEventListener("timeupdate", () => {
if (!isNaN(audio.duration)) {
progress.value = (audio.currentTime / audio.duration) * 100;
currentTimeEl.textContent = format(audio.currentTime);
}
});

// ⏳ duration fix
audio.addEventListener("loadedmetadata", () => {
durationEl.textContent = format(audio.duration);
});

// 🎯 seek
progress.addEventListener("input", () => {
audio.currentTime = (progress.value / 100) * audio.duration;
});

// ⏱ format
function format(sec) {
let m = Math.floor(sec / 60);
let s = Math.floor(sec % 60);
return m + ":" + (s < 10 ? "0" + s : s);
}

// 🔥 PLAYLIST WITH DURATION
songs.forEach((song, i) => {
let div = document.createElement("div");
div.classList.add("song");

div.innerHTML = `
<span>${song.title} - ${song.artist}</span>
<span id="d${i}">--:--</span>
`;

div.onclick = () => {
current = i;
loadSong(current);
audio.play();
isPlaying = true;
playBtn.textContent = "⏸️";
};

playlist.appendChild(div);
});

// 🔥 FETCH DURATION FOR EACH SONG
songs.forEach((song, i) => {
let tempAudio = new Audio(song.src);

tempAudio.addEventListener("loadedmetadata", () => {
document.getElementById("d" + i).textContent = format(tempAudio.duration);
});
});

// init
loadSong(current);
volume.value = 0.5;
audio.volume = 0.5;

</script>

</body>
</html>
